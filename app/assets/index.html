<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messages – Liquid Glass</title>
<style>
:root{--ga:.28;--blur:22px;--tx:#0b0b10;--tx2:rgba(60,60,67,.65);--sep:rgba(60,60,67,.18);--in:#e9e9eb;--intx:#000;--out:#0a84ff;--bg:#f2f2f7;--gtint:255,255,255;--gb:rgba(255,255,255,.55);--ease:cubic-bezier(.3,1.6,.5,1);--dur:.5s;--pd:.93;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--tx:#fff;--tx2:rgba(235,235,245,.6);--sep:rgba(255,255,255,.14);--in:#2c2c2e;--intx:#fff;--bg:#000;--gtint:30,30,34;--gb:rgba(255,255,255,.18)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--tx:#fff;--tx2:rgba(235,235,245,.6);--sep:rgba(255,255,255,.14);--in:#2c2c2e;--intx:#fff;--bg:#000;--gtint:30,30,34;--gb:rgba(255,255,255,.18)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;font-family:-apple-system,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;background:#111;color:var(--tx);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.phone{position:relative;margin:auto;width:min(100vw,430px);height:100%;max-height:none;overflow:hidden;overflow:clip;background:linear-gradient(160deg,#ff9a8b,#ff6a88 25%,#7f5af0 60%,#2cb5e8);}
@media(min-width:500px){html,body{display:flex}.phone{height:min(100dvh,860px);margin:auto;border-radius:44px;box-shadow:0 30px 80px #0008}}
.blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.8}
.glass{background:rgba(var(--gtint),var(--ga));backdrop-filter:blur(var(--blur)) saturate(190%);-webkit-backdrop-filter:blur(var(--blur)) saturate(190%);border:1px solid var(--gb);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -1px 2px rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.14)}
.home{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:0 0 70px}
.dock{display:flex;gap:18px;padding:14px 20px;border-radius:34px}
.icon{width:64px;height:64px;border-radius:15px;background:linear-gradient(#5df06b,#12b832);display:grid;place-items:center;box-shadow:0 4px 12px #0003}
.icon svg{width:36px;height:36px}
.app{position:absolute;inset:0;background:var(--bg);display:none;overflow:hidden;overflow:clip;transform-origin:50% 92%}
.app.on{display:block}
.screen{position:absolute;inset:0;background:var(--bg);overflow:hidden}
.screen.thread{transform:translateX(100%);background:var(--bg)}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 62px) 0 100px;-webkit-overflow-scrolling:touch}
.bar{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);height:46px;border-radius:26px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;z-index:5}
.gbtn{min-width:36px;height:36px;border-radius:18px;display:grid;place-items:center;padding:0 10px;font-size:17px;color:var(--out)}
.gbtn svg{width:19px;height:19px}
h1{font-size:34px;margin:6px 20px 8px;letter-spacing:-.5px}
.search{margin:0 16px 8px;height:38px;border-radius:19px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--tx2)}
.search input{flex:1;background:none;border:0;outline:0;font-size:17px;color:var(--tx);user-select:text;min-width:0}
.row{display:flex;gap:12px;align-items:center;padding:10px 20px;position:relative}
.row:after{content:"";position:absolute;left:84px;right:0;bottom:0;height:.5px;background:var(--sep)}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:20px;flex:none}
.rt{flex:1;min-width:0}.rt b{display:flex;justify-content:space-between;font-weight:600;font-size:17px}.rt b small{font-weight:400;color:var(--tx2);font-size:15px}
.rt p{margin:2px 0 0;color:var(--tx2);font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dot{width:10px;height:10px;border-radius:50%;background:var(--out);position:absolute;left:6px;top:50%;margin-top:-5px}
.msgs{display:flex;flex-direction:column;padding:0 14px}
.bub{max-width:76%;padding:8px 13px;border-radius:19px;font-size:17px;line-height:1.28;margin-top:2px;word-wrap:break-word;overflow-wrap:break-word;white-space:pre-wrap;user-select:text;position:relative}
.me{align-self:flex-end;background:var(--out);color:#fff}.th{align-self:flex-start;background:var(--in);color:var(--intx)}
.gap{margin-top:9px}
.stamp{align-self:center;font-size:12px;color:var(--tx2);margin:10px 0 4px}
.dl{align-self:flex-end;font-size:12px;color:var(--tx2);margin:3px 4px 0}
.typing{display:flex;gap:4px;padding:12px 14px}.typing i{width:8px;height:8px;border-radius:50%;background:#8e8e93;animation:ty 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}

.ttl{flex:1;min-width:0;text-align:center;font-size:11px;font-weight:600;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}

.ttl span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar.glass{background:rgba(var(--gtint),.72)}
.gbtn#back{flex:none;width:36px;padding:0}
.input{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;align-items:flex-end;z-index:5}

.sw{width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.4);position:relative;transition:background .25s}

.bub{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.perm{color:var(--tx2);font-size:15px;line-height:1.45;text-align:center;margin:0 0 18px}
#defState{color:var(--tx2);font-size:15px;font-weight:400}

/* ================= 3D / 4D depth engine ================= */
.phone{perspective:1100px;transform-style:preserve-3d}
.app{transform-style:preserve-3d}
.blob{will-change:transform;animation:drift 22s ease-in-out infinite alternate}
.blob:nth-of-type(2){animation-duration:28s;animation-delay:-6s}
@keyframes drift{
 0%{transform:translate3d(0,0,0) scale(1)}
 50%{transform:translate3d(14px,-18px,0) scale(1.06)}
 100%{transform:translate3d(-12px,16px,0) scale(.96)}
}
.msgs{perspective:900px;transform-style:preserve-3d}
.bub{
 transform:translate3d(0,var(--by,0px),var(--bz,0px)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--bs,1)) scale(var(--ps,1));
 transform-style:preserve-3d;backface-visibility:hidden;transform-origin:50% 50%;
 transition:transform .16s ease-out,opacity .2s ease-out;
 will-change:transform}
.bub.me{box-shadow:0 10px 22px -10px rgba(10,132,255,.75),0 2px 6px rgba(0,0,0,.16)}
.bub.th{box-shadow:0 10px 22px -12px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.12)}
.bub:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:radial-gradient(130px 90px at var(--mx,50%) var(--my,0%),rgba(255,255,255,.6),rgba(255,255,255,0) 70%);
 opacity:var(--hl,0);transition:opacity .22s ease-out;mix-blend-mode:soft-light}
.bar.glass{box-shadow:0 14px 30px -18px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.65),inset 0 -1px 2px rgba(255,255,255,.14)}
.sheet{transform-style:preserve-3d;box-shadow:0 30px 70px -20px rgba(0,0,0,.55),0 10px 24px -12px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.6)}
.row{transition:transform .18s ease-out}
.row.lift{transform:translateZ(14px) scale(1.012)}
.dock{box-shadow:0 26px 50px -22px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.7)}
.icon{transition:transform .18s ease-out;transform-style:preserve-3d}
.icon:active{transform:translateZ(22px) scale(1.06)}

<div class="app" id="app">
 <div class="screen" id="list">
  <div class="bar glass"><button class="gbtn" id="edit">Settings</button><button class="gbtn" id="closeApp" aria-label="Close app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><button class="gbtn" id="compose" aria-label="New message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/></svg></button></div>
  <div class="scroll"><h1>Messages</h1>
   <div class="search glass"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Search"></div>

 </div>
 <div class="screen thread" id="thread">
  <div class="bar glass"><button class="gbtn" id="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div class="ttl" id="ttl"></div><div style="width:36px;flex:none"></div></div>
  <div class="scroll" id="tscroll" style="padding-top:calc(env(safe-area-inset-top,0px) + 86px)"><div class="msgs" id="msgs"></div></div>
  <div class="input"><button class="plus glass" id="plus" aria-label="Contacts"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
   <div class="field glass"><input id="txt" placeholder="iMessage" autocomplete="off"><button class="send" id="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></div>
 </div>
 <div class="scrim" id="scrim"></div>
 <div class="ctxm glass" id="ctx"><button class="ci" data-a="copy"><span>Copy</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></svg></button><button class="ci del" data-a="del"><span>Delete</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div>
 <div class="sheet glass" id="sSet"><h2>Glass &amp; Bounce</h2>
  <div class="ctl"><label>Transparency <span id="v1"></span></label><input type="range" id="r1" min="0" max="80" value="28"></div>
  <div class="ctl"><label>Blur <span id="v2"></span></label><input type="range" id="r2" min="0" max="50" value="22"></div>

 <div class="search glass" style="margin:0 0 10px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="cq" placeholder="Search contacts"></div>

 <button class="done glass" data-close>Cancel</button></div>
<div class="sheet glass" id="sDefault"><h2>Default messaging app</h2>
 <p class="perm">Set Messages as your default SMS app so your texts land here. Incoming messages are saved to your phone&#39;s own SMS store — nothing leaves the device.</p>
 <button class="start" id="setDefault">Set as default</button>
 <button class="done glass" data-close>Not now</button></div>
</div>

<script>
const $=s=>document.querySelector(s),R=document.documentElement;
const S={on:true,k:.6,sp:.5};
const T=[];
const BR=(window.Android&&window.Android.loadThreads)?window.Android:null;
const PALETTE=["#ff6a88","#5e5ce6","#30b0c7","#ff9f0a","#34c759","#af52de","#ff375f","#0a84ff"];
const replies=["Sounds great! 😊","Haha okay","Wait, really?","On my way!","Let me check and tell you","Perfect, see you soon","😂😂","Okay done ✅"];
function fmtTime(ms){if(!ms)return'';const d=new Date(ms),n=new Date();
 const hm=((d.getHours()%12)||12)+':'+String(d.getMinutes()).padStart(2,'0');
 if(d.toDateString()===n.toDateString())return hm;
 const y=new Date(n.getTime()-86400000);if(d.toDateString()===y.toDateString())return 'Yesterday';
 return d.toLocaleDateString(undefined,{weekday:'short'})}
function colorFor(s){let h=7;for(let i=0;i<s.length;i++)h=(h*131+s.charCodeAt(i))>>>0;h=(h^(h>>>13))>>>0;return PALETTE[h%PALETTE.length]}
function ini(s){const m=String(s).replace(/[^0-9A-Za-z]/g,'');return m?m[0].toUpperCase():'#'}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
/* Run `fn` when a Web Animation settles. onfinish alone is not enough: an
   animation that is cancelled (or that never gets its first frame) would leave
   the sheet / menu / app stuck open and a delete that never reaches the store. */
function done(anim,fn,grace){
 let ran=false;const go=()=>{if(ran)return;ran=true;fn&&fn()};
 if(anim){anim.onfinish=go;anim.oncancel=go}
 let ms=0;try{const d=anim&&anim.effect&&anim.effect.getTiming().duration;if(typeof d==='number')ms=d}catch(e){}
 setTimeout(go,ms+(grace||200));return anim}
let lastSig='';
function loadThreads(){if(!BR)return false;try{
 const openId=(cur!==null&&T[cur])?T[cur].id:null,openAddr=(cur!==null&&T[cur])?T[cur].addr:null;
 const arr=JSON.parse(BR.loadThreads());
 const sig=arr.map(t=>t.id+'|'+t.date+'|'+t.snippet+'|'+t.unread).join('~');
 /* A conversation that exists only on this side (compose -> no provider id yet)
    has to survive a poll. Rebuilding T from the store alone dropped it, which
    left cur pointing at nothing and made the next Send silently do nothing. */
 /* the provider may hand back the same number written differently, so match on
    the normalised address too - an exact compare kept the local copy as well and
    the conversation showed up twice */
 const local=T.filter(t=>t.local&&!arr.some(a=>a.addr===t.addr||(nrm(t.addr)!==''&&nrm(a.addr)===nrm(t.addr))));
 const sig2=sig+'|L'+local.map(t=>t.addr).join(',');
 /* Nothing changed: leave T untouched. Rebuilding it from the store replaced the
    open thread's message array with its one-line snippet, so a long-press could
    no longer find the bubble it was aimed at (copy / delete stopped opening) and
    the next send drew the snippet back as a phantom received bubble. */
 if(sig2===lastSig)return false;
 lastSig=sig2;
 T.length=0;
 arr.forEach(t=>T.push({id:t.id,addr:t.addr,n:t.addr,c:colorFor(t.addr),t:fmtTime(t.date),d:t.date,u:t.unread>0,m:[{x:t.snippet||''}]}));
 local.forEach(t=>T.push(t));
 if(cur!==null){let k=-1;
  if(openId&&openId>0)k=T.findIndex(x=>x.id===openId);
  /* the provider can hand the same conversation back with the number written
     differently ("+91 98765 43210" vs "+919876543210"): an exact compare here
     dropped cur and the open chat vanished on the next poll */
  if(k<0&&openAddr)k=findThread(openAddr,0);
  cur=k>=0?k:null}
 renderRows();return true}catch(e){return false}}
function loadMsgs(i){const t=T[i];if(!BR||!t)return;try{
 const arr=JSON.parse(BR.loadMessages(t.id||0,t.addr));
 t.m=arr.map(m=>({id:m.id,f:m.out?1:0,x:m.body,d:m.date}))}catch(e){}}
let cur=null,busy=false;
function ease(){const o=1+S.k*1.3;R.style.setProperty('--ease',`cubic-bezier(.3,${o.toFixed(2)},.5,1)`);R.style.setProperty('--dur',(0.9-S.sp*.6).toFixed(2)+'s');R.style.setProperty('--pd',S.on?(1-.14*S.k).toFixed(3):1)}
function spring(el,from,mid,to,dur,fill){ // Web Animations bounce
 if(!S.on){el.animate([{transform:to}],{duration:1,fill:fill||'none'});return}

<script>
/* ---- Native shell bridge (Android WebView) ---- */
(function () {
  // 1. Clipboard: navigator.clipboard is unreliable on file:// in WebView,
  //    so route Copy through the native ClipboardManager when it exists.
  try {
    var nativeCopy = function (t) {
      try { window.Android.copy(String(t)); return Promise.resolve(); }
      catch (e) { return Promise.reject(e); }
    };
    if (window.Android && window.Android.copy) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText = nativeCopy;
      } else {
        Object.defineProperty(navigator, 'clipboard', { value: { writeText: nativeCopy } });
      }
    }
  } catch (e) {}

  // 2. Hardware back: unwind menu -> sheet -> thread -> app before the app exits.
  window.__androidBack = function () {
    try {
      var cx = document.querySelector('#ctx');
      if (cx && cx.classList.contains('on')) { closeCtx(); document.querySelector('#scrim').classList.remove('on'); return true; }
      if (document.querySelector('.sheet.on')) { closeSheets(); return true; }
      if (cur !== null && cur !== undefined) { backThread(); return true; }
      if (document.querySelector('#app.on')) { closeApp(); return true; }
    } catch (e) {}
    return false;
  };
})();
